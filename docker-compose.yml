services:
  api:
    build: ./api
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/modelgenerator.db
      BACKEND_MODE: ${BACKEND_MODE:-mock}
    volumes: [./data:/data]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  web:
    build: ./web
    ports: ["127.0.0.1:80:80"]
    depends_on:
      api: {condition: service_healthy}
  sf3d-worker:
    build:
      context: .
      dockerfile: sf3d-worker/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      BACKEND_MODE: ${BACKEND_MODE:-mock}
      SF3D_DIR: /opt/stable-fast-3d
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_HUB_OFFLINE: "1"
      U2NET_HOME: /models/rembg
      HUNYUAN_MODEL_DIR: /models/hunyuan3d-2mv
    depends_on:
      api: {condition: service_healthy}
    # Official SF3D source and dependencies are installed in the worker image.
    # Offline inference, but writable for Transformers' one-time cache migration.
    volumes: [./data:/data, ./models/huggingface:/models/huggingface, ./models/rembg:/models/rembg:ro, ./models/hunyuan3d-2mv:/models/hunyuan3d-2mv:ro]
  blender-worker:
    build: ./blender-worker
    environment: {API_BASE_URL: http://api:8000}
    volumes: [./data:/data]
    depends_on:
      api: {condition: service_healthy}
